[project]
name = "selves-and-spaces-backend"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.143.0",
    "httpx>=0.28.1",
    "pydantic-settings>=2.15.0",
    "supabase>=2.32.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = '-m "not integration"'
markers = [
    "integration: talks to the real Supabase project (run with: pytest -m integration)",
]
